name: Deploy to cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Ambil source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js 22 + cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependency sesuai lockfile
      - name: Install dependencies
        run: npm ci

      # Build Vite -> output ke folder dist
      - name: Build
        run: npm run build

      # Upload isi dist ke server via FTPS (akun FTP terkunci ke document root)
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /
          # Hanya kelola file yang diupload workflow ini (jangan hapus cgi-bin/php.ini dll)
          dangerous-clean-slate: false